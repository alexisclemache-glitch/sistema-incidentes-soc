services:
  - type: web
    name: sistema-incidentes-soc
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: incidentes-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: incidentes-db
    databaseName: incidentes_db
    user: incidentes_user
    plan: free
